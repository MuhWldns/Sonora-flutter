<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,0&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<title>Sonora · Dock &amp; Navigasi (dark)</title>
</head>
<body>
<div class="stage">
  <div class="phone"><div class="screen">
    <div class="statusbar"><span>9:41</span><span class="sysicons"><span class="ms">signal_cellular_alt</span><span class="ms">wifi</span><span class="ms">battery_full</span></span></div>
    <div class="content" style="filter:blur(0px)">
      <div class="page-head">
        <span class="display">Sonora</span>
        <span class="ms">refresh</span>
      </div>
      <div class="sec-row"><span class="section-h">Album untukmu</span><span class="sec-link">Lihat semua<span class="ms">chevron_right</span></span></div>
      <div class="shelf">
        <div class="shelf-card"><img class="art" src="https://picsum.photos/seed/sonora-album7/300/300" alt=""><div class="ttl">After Hours</div><div class="sub">The Weeknd</div></div>
        <div class="shelf-card"><img class="art" src="https://picsum.photos/seed/sonora-album8/300/300" alt=""><div class="ttl">Melodrama</div><div class="sub">Lorde</div></div>
        <div class="shelf-card"><img class="art" src="https://picsum.photos/seed/sonora-album9/300/300" alt=""><div class="ttl">Isolation</div><div class="sub">Kali Uchis</div></div>
      </div>
    </div>
    <div class="dock">
      <div class="micro" style="width:62%"></div>
      <div class="row">
        <img class="art" src="https://picsum.photos/seed/sonora-track3/100/100" alt="">
        <div class="meta"><div class="ttl">Midnight City</div><div class="sub">M83</div></div>
        <button class="play"><span class="ms">pause</span></button>
      </div>
    </div>
    <div class="navbar">
      <div class="tab on"><span class="ms">home</span>Beranda</div>
      <div class="tab"><span class="ms">search</span>Cari</div>
      <div class="tab"><span class="ms">settings</span>Pengaturan</div>
    </div>
  </div></div>
</div>
</body>
</html>
