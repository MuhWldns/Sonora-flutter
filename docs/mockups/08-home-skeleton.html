<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,0&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<title>Sonora · Beranda (skeleton)</title>
</head>
<body>
<div class="stage">
  <div class="phone"><div class="screen">
    <div class="statusbar"><span>9:41</span><span class="sysicons"><span class="ms">signal_cellular_alt</span><span class="ms">wifi</span><span class="ms">battery_full</span></span></div>
    <div class="content">
      <div class="page-head">
        <span class="display">Sonora</span>
        <span class="ms">refresh</span>
      </div>
      <div class="sec-row"><span class="skel" style="width:120px;height:20px;border-radius:6px"></span></div>
      <div class="shelf">
        <div class="skel" style="width:150px;height:150px;border-radius:12px"></div>
        <div class="skel" style="width:150px;height:150px;border-radius:12px"></div>
      </div>
      <div class="sec-row"><span class="skel" style="width:150px;height:20px;border-radius:6px"></span></div>
      <div class="shelf">
        <div>
          <div class="skel" style="width:150px;height:150px;border-radius:12px"></div>
          <div class="skel" style="width:110px;height:12px;margin-top:8px"></div>
          <div class="skel" style="width:70px;height:10px;margin-top:6px"></div>
        </div>
        <div>
          <div class="skel" style="width:150px;height:150px;border-radius:12px"></div>
          <div class="skel" style="width:130px;height:12px;margin-top:8px"></div>
          <div class="skel" style="width:80px;height:10px;margin-top:6px"></div>
        </div>
      </div>
      <div class="sec-row"><span class="skel" style="width:100px;height:20px;border-radius:6px"></span></div>
      <div class="sk-row"><div class="skel a"></div><div style="flex:1"><div class="skel b"></div><div class="skel c"></div></div></div>
      <div class="sk-row"><div class="skel a"></div><div style="flex:1"><div class="skel b"></div><div class="skel c"></div></div></div>
      <div class="sk-row"><div class="skel a"></div><div style="flex:1"><div class="skel b"></div><div class="skel c"></div></div></div>
    </div>
    <div class="navbar">
      <div class="tab on"><span class="ms">home</span>Beranda</div>
      <div class="tab"><span class="ms">search</span>Cari</div>
      <div class="tab"><span class="ms">settings</span>Pengaturan</div>
    </div>
  </div></div>
</div>
</body>
</html>
