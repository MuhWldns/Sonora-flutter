<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,0&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<title>Sonora · Detail Album (dark)</title>
</head>
<body>
<div class="stage">
  <div class="phone"><div class="screen">
    <div class="statusbar"><span>9:41</span><span class="sysicons"><span class="ms">signal_cellular_alt</span><span class="ms">wifi</span><span class="ms">battery_full</span></span></div>
    <div class="content">
      <div class="topbar">
        <span class="ms">arrow_back</span>
        <span class="ms">more_vert</span>
      </div>
      <img class="hero-art" src="https://picsum.photos/seed/sonora-album1/680/680" alt="">
      <div class="hero-meta">
        <div class="ovl"><span class="overline-t">Album</span><span class="dot"></span></div>
        <div class="display" style="margin-top:6px">Nectar</div>
        <div class="body-t" style="margin-top:4px">Joji · 2020 · 18 lagu</div>
      </div>
      <div class="hero-actions">
        <button class="btn primary"><span class="ms">play_arrow</span>Putar semua</button>
        <button class="btn ghost"><span class="ms">shuffle</span>Acak</button>
      </div>
      <div class="trow" style="margin-top:10px">
        <span class="mono-t" style="width:22px">01</span>
        <div class="meta"><div class="ttl">Tick Tock <span style="font-size:9px;font-weight:700;background:var(--cont);color:var(--t3);border-radius:3px;padding:1px 4px;vertical-align:2px">E</span></div><div class="sub">Joji · 3:26</div></div>
        <span class="ms">more_vert</span>
      </div>
      <div class="trow active">
        <span class="mono-t" style="width:22px">02</span>
        <div class="meta"><div class="ttl">Daylight</div><div class="sub">Joji · 2:58</div></div>
        <span class="wave"><i></i><i></i><i></i><i></i></span>
      </div>
      <div class="trow">
        <span class="mono-t" style="width:22px">03</span>
        <div class="meta"><div class="ttl">Gimme Love</div><div class="sub">Joji · 3:12</div></div>
        <span class="ms">more_vert</span>
      </div>
    </div>
  </div></div>
</div>
</body>
</html>
