<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,0&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<title>Sonora · Full Player (light)</title>
<style>
  :root {
    --canvas: #eef1f2; --base: #fafbfb; --clow: #f0f3f4; --cont: #e3e8ea;
    --chigh: #d9dfe1; --chighest: #c3cccf;
    --glow: rgba(224, 58, 62, 0.14);
    --t1: #141c21; --t2: #51616b; --t3: #8a97a0;
  }
  .fp-art { box-shadow: 0 20px 40px -14px rgba(0, 0, 0, 0.3); }
</style>
</head>
<body>
<div class="stage">
  <div class="phone"><div class="screen">
    <div class="statusbar"><span>9:41</span><span class="sysicons"><span class="ms">signal_cellular_alt</span><span class="ms">wifi</span><span class="ms">battery_full</span></span></div>
    <div class="topbar">
      <span class="ms">keyboard_arrow_down</span>
      <span style="display:flex;gap:2px"><span class="ms">queue_music</span><span class="ms">more_vert</span></span>
    </div>
    <div style="flex:1;display:flex;flex-direction:column;justify-content:center;position:relative">
      <div class="fp-glow" style="top:8px;left:calc(50% - 170px)"></div>
      <img class="fp-art" style="align-self:center" src="https://picsum.photos/seed/sonora-album1/640/640" alt="">
      <div style="text-align:center;margin-top:26px">
        <div class="overline-t">Sedang diputar dari album</div>
        <div class="display" style="font-size:27px;margin-top:6px">Daylight</div>
        <div class="body-t" style="margin-top:3px">Joji</div>
      </div>
      <div class="scrub" style="margin-top:22px">
        <div class="track">
          <div class="fill" style="width:34%"></div>
          <div class="thumb" style="left:34%"></div>
        </div>
        <div class="times"><span class="mono-t">1:06</span><span class="mono-t">2:58</span></div>
      </div>
      <div class="transport" style="margin-top:14px">
        <span class="ms on">shuffle</span>
        <span class="ms">skip_previous</span>
        <button class="big"><span class="ms">pause</span></button>
        <span class="ms">skip_next</span>
        <span class="ms">repeat</span>
      </div>
      <div class="fp-secondary" style="margin-top:20px;padding:0 34px">
        <span class="ms">favorite_border</span>
        <span class="ms">lyrics</span>
        <span class="ms">devices</span>
      </div>
    </div>
  </div></div>
</div>
</body>
</html>
